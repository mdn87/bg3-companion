[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bg3-helper"
version = "0.1.0"
description = "Local Windows capture and input bridge for a session-driven BG3 companion"
requires-python = ">=3.11"
dependencies = ["mss==10.1.0", "Pillow==12.2.0", "pywin32==311; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
bg3-helper = "bg3_helper.__main__:main"

[tool.setuptools.packages.find]
include = ["bg3_helper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
